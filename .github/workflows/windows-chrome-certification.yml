name: Windows Chrome Certification (10 runs)

on:
  workflow_dispatch:

jobs:
  windows-chrome-certification:
    name: Six-theme chrome certification, 10 consecutive runs
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bootstrap Runtime And Test Dependencies
        shell: pwsh
        run: python scripts/manage_install.py bootstrap --skip-doctor --include-dev

      - name: Run Ten Consecutive Chrome Certifications
        shell: pwsh
        env:
          PYTHONFAULTHANDLER: "1"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          New-Item -ItemType Directory -Force -Path chrome-runs | Out-Null
          for ($run = 1; $run -le 10; $run++) {
            $log = "chrome-runs/run-$run.txt"
            Write-Host "Chrome certification $run/10"
            & .\.venv\Scripts\python.exe -u scripts/certify_gui.py --aspects chrome 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              Write-Error "Chrome certification $run/10 failed with exit code $code; stopping without retry."
              exit 1
            }
          }
          Write-Host "All ten consecutive six-theme chrome certifications passed."

      - name: Upload Per-run Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-chrome-certification-logs
          path: chrome-runs/
          if-no-files-found: warn
          retention-days: 14
