name: CI

on:
  push:
  pull_request:
  # The Vulkan job below builds audio.cpp, which is far too slow to run on every
  # pull request, so it is gated to non-PR events (see that job's `if:`) and these
  # two triggers are what keep it running regularly.
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux GUI Runtime Dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail

          resolve_pkg() {
            for candidate in "$@"; do
              if apt-cache show "$candidate" >/dev/null 2>&1; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }

          glib_pkg="$(resolve_pkg libglib2.0-0t64 libglib2.0-0)"
          asound_pkg="$(resolve_pkg libasound2t64 libasound2)"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$asound_pkg" \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            "$glib_pkg" \
            libnss3 \
            libopengl0 \
            libpulse0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Bootstrap Runtime And Test Dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/manage_install.py bootstrap --skip-doctor --include-dev

      - name: Bootstrap Runtime And Test Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/manage_install.py bootstrap --skip-doctor --include-dev

      - name: Windows GUI Event Filter No-op Diagnostic
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          PYTHONFAULTHANDLER: "1"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          New-Item -ItemType Directory -Force -Path gui-certification-runs | Out-Null
          & .\.venv\Scripts\python.exe -u scripts/probe_gui_without_tooltip_filter.py --aspects contrast,chrome,studio,wizard 2>&1 | Tee-Object -FilePath "gui-certification-runs/no-op-probe.txt"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Error "No-op diagnostic failed with exit code $code."
            exit $code
          }
          Write-Host "The full six-theme certification passed with eventFilter replaced by a no-op."

      - name: Doctor Via Manager (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/manage_install.py doctor --skip-model-init --ci

      - name: Doctor Via Manager (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/manage_install.py doctor --skip-model-init --ci

      - name: Doctor Wrapper (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./doctor_oracle_tts.sh --skip-model-init --ci

      - name: Doctor Wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\doctor_oracle_tts.ps1 --skip-model-init --ci

      - name: Run Test Suite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./.venv/bin/pytest

      - name: Run Test Suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\pytest.exe

      # The doctor runs the deterministic smoke render inside its report
      # (steps above); this runs the standalone runner directly so the smoke
      # render is a named signal in its own right, on both operating systems,
      # on every push and pull request. It needs no model and no network: the
      # smoke's engine is deterministic and the text-repair helpers run on
      # their built-in fallbacks. The runner verifies its own outputs and
      # exits nonzero when a render comes back empty, so a green step here
      # means real audio was produced and cached on the second pass.
      - name: Deterministic Smoke Render (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./.venv/bin/python scripts/smoke_render.py

      - name: Deterministic Smoke Render (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts/smoke_render.py

      # The suite pins contrast against a token table, section chrome through
      # a faked window, and the recording-studio and inference-tour dialogs not
      # at all; this certifies all of it on the REAL MainWindow and the REAL
      # dialogs for every theme, so a theme regression that only shows in a
      # rendered window fails here. It needs no model and no network, redirects
      # the app settings to a throwaway config root, neutralizes the modal
      # startup dialogs per window, and exits nonzero the moment a theme fails
      # a check or a theme carries no certification entry. One named step PER
      # ASPECT per OS, each selecting its aspect by name, so the job list says
      # WHICH certification broke: a contrast regression and a chrome
      # regression are two differently named red steps instead of one red
      # "certification" whose reason lives in a log. The steps are the harness's
      # four aspects in its own order and each runs one process; that costs
      # more than the merged sweep (measured on this machine: 8.1 + 13.8 + 9.3
      # + 8.9 = 40.1 s of the four, against 17.5 s for one process running all
      # four), because every aspect rebuilds the six-theme window loop it
      # needs. The attribution is what the time buys. The aspects are pinned
      # against the harness's own ASPECTS tuple by
      # tests/test_gui_sections_chrome.py, so adding an aspect without a step
      # here fails the suite rather than certifying nowhere. The suite's local
      # gates select one aspect at a time the same way (`contrast` and
      # `studio,wizard` from tests/test_gui_theme_certification.py, `chrome`
      # from tests/test_gui_sections_chrome.py).
      - name: GUI Six-Theme Certification - contrast (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./.venv/bin/python scripts/certify_gui.py --aspects contrast

      - name: GUI Six-Theme Certification - contrast (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts/certify_gui.py --aspects contrast

      - name: GUI Six-Theme Certification - chrome (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./.venv/bin/python scripts/certify_gui.py --aspects chrome

      - name: GUI Six-Theme Certification - chrome (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts/certify_gui.py --aspects chrome

      - name: GUI Six-Theme Certification - studio (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./.venv/bin/python scripts/certify_gui.py --aspects studio

      - name: GUI Six-Theme Certification - studio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts/certify_gui.py --aspects studio

      - name: GUI Six-Theme Certification - wizard (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./.venv/bin/python scripts/certify_gui.py --aspects wizard

      - name: GUI Six-Theme Certification - wizard (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts/certify_gui.py --aspects wizard

      # The original Windows failure was intermittent and appeared during
      # repeated window construction. Run the complete six-theme certification
      # serially ten times, stop on the first failure, and retain each log.
      - name: Windows Six-Theme Certification - 10 consecutive runs
        if: runner.os == 'Windows' && always()
        shell: pwsh
        env:
          PYTHONFAULTHANDLER: "1"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          New-Item -ItemType Directory -Force -Path gui-certification-runs | Out-Null
          for ($run = 1; $run -le 10; $run++) {
            $log = "gui-certification-runs/run-$run.txt"
            Write-Host "Full six-theme certification $run/10"
            & .\.venv\Scripts\python.exe -u scripts/certify_gui.py --aspects contrast,chrome,studio,wizard 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              Write-Error "Certification $run/10 failed with exit code $code; stopping without retry."
              exit 1
            }
          }
          Write-Host "All ten consecutive full six-theme certifications passed."

      - name: Upload Windows Certification Logs
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-six-theme-certification-logs
          path: gui-certification-runs/
          if-no-files-found: warn
          retention-days: 14

      # The suite pins the bulk-restyle gate against a duck-typed app stand-in
      # and a synthetic event; this certifies it on the REAL window under a real
      # Qt repolish, and splits the switch cost into the terms a temp probe
      # measured (structure, propagation, rule matching, and ours). It asserts
      # bounds and relationships rather than milliseconds -- the timings it
      # prints are of the runner and would make this step flake, so it fails
      # only on the facts, including that the app's own Ctrl+hover filter finds
      # the scope open for the entire storm.
      - name: Theme Switch Restyle Split (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./.venv/bin/python scripts/certify_theme_switch.py

      - name: Theme Switch Restyle Split (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts/certify_theme_switch.py

      # The doctor is the launch gate, so its verdict must not depend on how
      # many times it has been run. That regressed twice, each time because a
      # check graded state it had created on the earlier run, and neither was
      # visible in a single run. This runs the gate twice in the mode the steps
      # above use and fails if the two reports differ.
      #
      - name: Doctor Is Idempotent Across Runs (Linux)
        if: runner.os == 'Linux'
        run: ./.venv/bin/python scripts/doctor_idempotence.py --skip-model-init --ci

      - name: Doctor Is Idempotent Across Runs (Windows)
        if: runner.os == 'Windows'
        run: python scripts/doctor_idempotence.py --skip-model-init --ci

      # The working tree is not a fresh checkout: it accumulates a venv, a native
      # build, and reference clips that change what the gate says. This runs the
      # gate and the documented entry points in a clean `git archive HEAD` tree
      # and fails if anything differs from this tree for a reason nobody has
      # registered -- which is how `./oracle` being tracked 100644 was found. The
      # suite leg is left out here because the step above already runs it; run
      # this script with no --only to get all three legs.
      # Linux only: the matrix's rows are the .sh wrappers, which do not exist on
      # Windows (the .ps1 entry points are covered by windows-install-smoke).
      - name: Fresh Clone Acceptance (Linux)
        if: runner.os == 'Linux'
        run: python scripts/fresh_clone_acceptance.py --only doctor,wrappers

  # Every head must be answerable for its suite counts: either recorded in
  # scripts/suite_counts_baseline.json, or inheriting one from a recorded commit
  # whose tree is identical apart from that file. RECORDING costs a full suite
  # run in a fresh worktree (minutes), so it stays a deliberate act; ANSWERING
  # costs a JSON lookup plus a two-tree diff, which is cheap enough to gate every
  # push -- and that is the point. Until this job existed, nothing refused an
  # unrecorded head: the script said "an unrecorded commit is a question, not a
  # pass" and nobody asked the question in CI. Exit 2 is that refusal (no entry
  # for the head, and no recorded commit checks out the same suite), so this job
  # is red exactly when a head's counts are neither recorded nor inheritable,
  # and green otherwise -- on recorded heads and on the commit that carries a
  # recording, which can never be recorded itself and inherits by tree
  # comparison instead.
  #
  # Full history on purpose: the inheritance comparison diffs against recorded
  # commits, and a shallow clone never fetched them, so the gate would refuse
  # every head for the wrong reason. No bootstrap either: the availability path
  # is stdlib plus git, and needing the project's dependencies to refuse a
  # missing baseline would be one more thing that could fail before the gate did.
  suite-counts-availability:
    name: Suite counts recorded or inheritable (every head)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse A Head Whose Suite Counts Are Neither Recorded Nor Inheritable
        run: python scripts/certify_suite_counts.py --availability

  # The Vulkan smoke skipped in CI from the day it was written: it needs a Vulkan
  # device, a built audiocpp_cli and the Chatterbox ggml model, and the runner had
  # none of them. A skip looks exactly like a pass in a green run, so the suite
  # covered nothing here and said so only to whoever read the skip summary.
  #
  # This job provides all three and then runs the suite with ORACLE_FAIL_ON_SKIP=1,
  # so a skip fails the job instead of hiding in it.
  vulkan-smoke:
    name: Vulkan backend (audio.cpp built, no skips allowed)
    runs-on: ubuntu-latest
    # Not on pull requests: the audio.cpp build is the expensive part and a PR does
    # not change it. Push to a branch, the weekly schedule, or run it by hand.
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    # AUDIOCPP_MODELS_ROOT is deliberately NOT a job-level `env:`: the `runner`
    # context exists only at step level, and declaring it here made GitHub
    # reject the ENTIRE workflow file ("Unrecognized named-value: 'runner'") —
    # every run since 4c436da failed with zero jobs, so no step on any OS ever
    # ran again, including the six-theme certifications below. It rides the
    # step that needs it instead.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Vulkan And Build Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          # glslc is not optional: audio.cpp's ggml-vulkan CMakeLists does
          # `find_package(Vulkan COMPONENTS glslc REQUIRED)`. vulkan-tools provides
          # the vulkaninfo the smoke's device probe calls, and mesa-vulkan-drivers
          # provides the software ICD (lvp) that lets a GPU-less runner report a
          # device at all.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            git \
            glslc \
            libegl1 \
            libpulse0 \
            libvulkan-dev \
            mesa-vulkan-drivers \
            ninja-build \
            pkg-config \
            spirv-headers \
            vulkan-tools

      # This is the smoke's own device gate, run by hand first so a missing ICD
      # fails here with a readable message instead of turning into a skip later.
      # On a GPU-less runner the device reported here is Mesa's llvmpipe.
      - name: Verify A Vulkan Device Is Visible
        shell: bash
        run: |
          set -Eeuo pipefail
          vulkaninfo --summary | head -40
          echo
          echo "Device probe (vulkaninfo --summary) succeeded, so the smoke's first gate is open."

      - name: Bootstrap Runtime And Test Dependencies
        shell: bash
        run: python scripts/manage_install.py bootstrap --skip-doctor --include-dev

      # The model is the only download worth caching: it is large and does not
      # change between runs, unlike the source tree the build clones.
      - name: Cache The Chatterbox GGML Model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oracle-vulkan-models
          key: vulkan-smoke-model-chatterbox_q8_0-v1

      # scripts/vulkan_ci_smoke.py builds the CLI, fetches the model, asserts the
      # smoke's three gates resolve, then runs the suite with ORACLE_FAIL_ON_SKIP=1.
      - name: Build audio.cpp, Fetch The Model, Run The Suite Without Skips
        shell: bash
        # Outside the clone path on purpose: scripts/build_audio_cpp.sh clones
        # into audio.cpp/, and git refuses to clone into a non-empty directory
        # -- a cache restored inside it would break the build on the first
        # cached run. The cache step above restores to this same expression, so
        # the two cannot diverge, and `runner` is a legal context here (step
        # level) where it was not at job level.
        env:
          AUDIOCPP_MODELS_ROOT: ${{ runner.temp }}/oracle-vulkan-models
        run: ./.venv/bin/python scripts/vulkan_ci_smoke.py

  windows-install-smoke:
    name: Windows installer end to end (temp profile, launchers, GUI)
    runs-on: windows-latest
    # The suite pins what the installer writes; this job proves those files run.
    # It installs the runtime, downloads the pinned Chatterbox checkpoint and the
    # installer's own doctor renders a smoke pass, so it takes minutes — the
    # matrix above still gates every push and pull request quickly. Raise the
    # timeout only if a real install legitimately needs longer.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The pinned revisions are the cache key: a pin bump invalidates it, so a
      # stale model can never be reused across a pin change.
      - name: Cache Model And pip Downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/oracle-smoke/hf
            ${{ runner.temp }}/oracle-smoke/pip-cache
          key: install-smoke-${{ runner.os }}-${{ hashFiles('src/the_oracle/models/pins.py') }}

      - name: Ensure ffmpeg Is Available
        shell: pwsh
        run: |
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            ffmpeg -version | Select-Object -First 1
          } else {
            choco install ffmpeg -y --no-progress
          }

      # The profile path contains a space on purpose: the generated .cmd
      # launcher and the Start Menu entry have to survive quoting, and this
      # project's own checkout path has a space in it.
      - name: Install End To End And Exercise The Launchers
        shell: pwsh
        run: |
          python scripts/windows_install_smoke.py `
            --profile "${{ runner.temp }}\oracle smoke profile" `
            --hf-home "${{ runner.temp }}\oracle-smoke\hf" `
            --pip-cache "${{ runner.temp }}\oracle-smoke\pip-cache"

  # The Windows certification steps in the matrix above die on this runner with
  # rc=3221225477 (0xC0000005, access violation) and EMPTY stdout and stderr —
  # no traceback, no aspect progress, no faulting line — so CI contains nothing
  # that says what faulted. The suite's own Qt tests pass on the same runner,
  # including the two that call QWidget.grab(), so plain widget rendering is
  # exonerated and the fault is somewhere in what the certifier does beyond it.
  #
  # Two facts make the frame capturable without manufacturing a consent
  # decision: crash_consent.json is gitignored, so a fresh checkout is consent
  # OFF and the certifier deliberately never arms its own file dump, which
  # leaves PYTHONFAULTHANDLER — Python's own stderr-targeted handler —
  # registered and free to write the faulting stack as the process dies; and
  # -u keeps the certifier's progress unbuffered, so a process killed by an
  # unhandled exception cannot take the aspect it was standing in down with
  # its output buffer (which is why the suite saw stdout empty even though the
  # sweep had been printing for minutes).
  #
  # No consent file is written here: the job captures with the checkout's own
  # absent consent, i.e. exactly the state every CI run already has. The run is
  # the hermeticity test's repro byte for byte — full sweep, no --aspects.
  #
  # Manual only (workflow_dispatch): this is a crash hunt, not a gate. It is
  # expected to be red until the fault is fixed, and red on every push would
  # say nothing the suite failures do not already say.
  windows-certifier-fault-capture:
    name: Windows certifier native-fault capture (manual)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bootstrap Runtime And Test Dependencies
        shell: pwsh
        run: python scripts/manage_install.py bootstrap --skip-doctor --include-dev

      # stderr carries the faulthandler dump, stdout carries the aspect
      # progress, and both are teed into the artifact so the frame survives
      # after the runner's log expires. The pipe's own exit status is the
      # certifier's; pwsh cannot `exit` a raw 0xC0000005 value (it overflows
      # Int32), so the raw code is printed here and the step fails with 1.
      - name: Run The Certifier With faulthandler On Stderr
        shell: pwsh
        env:
          PYTHONFAULTHANDLER: "1"
          QT_QPA_PLATFORM: "offscreen"
        timeout-minutes: 25
        run: |
          $out = "certifier-fault.txt"
          & .\.venv\Scripts\python.exe -u scripts/certify_gui.py 2>&1 | Tee-Object -FilePath $out
          $code = $LASTEXITCODE
          Write-Host "certifier exit code: $code (the suite observed 3221225477 = 0xC0000005)"
          if ($code -ne 0) { exit 1 }

      - name: Upload The Fault Dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-certifier-fault
          path: certifier-fault.txt
          if-no-files-found: warn
          retention-days: 14
