name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux GUI Runtime Dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail

          resolve_pkg() {
            for candidate in "$@"; do
              if apt-cache show "$candidate" >/dev/null 2>&1; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }

          glib_pkg="$(resolve_pkg libglib2.0-0t64 libglib2.0-0)"
          asound_pkg="$(resolve_pkg libasound2t64 libasound2)"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$asound_pkg" \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            "$glib_pkg" \
            libnss3 \
            libopengl0 \
            libpulse0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Bootstrap Runtime And Test Dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/manage_install.py bootstrap --skip-doctor --include-dev

      - name: Bootstrap Runtime And Test Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/manage_install.py bootstrap --skip-doctor --include-dev

      - name: Doctor Via Manager (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/manage_install.py doctor --skip-model-init --ci

      - name: Doctor Via Manager (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/manage_install.py doctor --skip-model-init --ci

      - name: Doctor Wrapper (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./doctor_oracle_tts.sh --skip-model-init --ci

      - name: Doctor Wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\doctor_oracle_tts.ps1 --skip-model-init --ci

      - name: Run Test Suite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./.venv/bin/pytest

      - name: Run Test Suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\pytest.exe
