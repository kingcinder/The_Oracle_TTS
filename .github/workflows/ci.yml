name: CI

on:
  push:
  pull_request:
  # The Vulkan job below builds audio.cpp, which is far too slow to run on every
  # pull request, so it is gated to non-PR events (see that job's `if:`) and these
  # two triggers are what keep it running regularly.
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux GUI Runtime Dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail

          resolve_pkg() {
            for candidate in "$@"; do
              if apt-cache show "$candidate" >/dev/null 2>&1; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }

          glib_pkg="$(resolve_pkg libglib2.0-0t64 libglib2.0-0)"
          asound_pkg="$(resolve_pkg libasound2t64 libasound2)"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$asound_pkg" \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            "$glib_pkg" \
            libnss3 \
            libopengl0 \
            libpulse0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Bootstrap Runtime And Test Dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/manage_install.py bootstrap --skip-doctor --include-dev

      - name: Bootstrap Runtime And Test Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/manage_install.py bootstrap --skip-doctor --include-dev

      - name: Doctor Via Manager (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/manage_install.py doctor --skip-model-init --ci

      - name: Doctor Via Manager (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/manage_install.py doctor --skip-model-init --ci

      - name: Doctor Wrapper (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./doctor_oracle_tts.sh --skip-model-init --ci

      - name: Doctor Wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\doctor_oracle_tts.ps1 --skip-model-init --ci

      - name: Run Test Suite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./.venv/bin/pytest

      - name: Run Test Suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\pytest.exe

      # The doctor is the launch gate, so its verdict must not depend on how
      # many times it has been run. That regressed twice, each time because a
      # check graded state it had created on the earlier run, and neither was
      # visible in a single run. This runs the gate twice in the mode the steps
      # above use and fails if the two reports differ.
      #
      # Deliberately no `if:` and no `shell:` override: it is one command, and
      # each runner's default shell (bash, pwsh) runs it identically, so the
      # check covers both operating systems instead of silently covering one.
      - name: Doctor Is Idempotent Across Runs
        run: python scripts/doctor_idempotence.py --skip-model-init --ci

      # The working tree is not a fresh checkout: it accumulates a venv, a native
      # build, and reference clips that change what the gate says. This runs the
      # gate and the documented entry points in a clean `git archive HEAD` tree
      # and fails if anything differs from this tree for a reason nobody has
      # registered -- which is how `./oracle` being tracked 100644 was found. The
      # suite leg is left out here because the step above already runs it; run
      # this script with no --only to get all three legs.
      # Linux only: the matrix's rows are the .sh wrappers, which do not exist on
      # Windows (the .ps1 entry points are covered by windows-install-smoke).
      - name: Fresh Clone Acceptance (Linux)
        if: runner.os == 'Linux'
        run: python scripts/fresh_clone_acceptance.py --only doctor,wrappers

  # The Vulkan smoke skipped in CI from the day it was written: it needs a Vulkan
  # device, a built audiocpp_cli and the Chatterbox ggml model, and the runner had
  # none of them. A skip looks exactly like a pass in a green run, so the suite
  # covered nothing here and said so only to whoever read the skip summary.
  #
  # This job provides all three and then runs the suite with ORACLE_FAIL_ON_SKIP=1,
  # so a skip fails the job instead of hiding in it.
  vulkan-smoke:
    name: Vulkan backend (audio.cpp built, no skips allowed)
    runs-on: ubuntu-latest
    # Not on pull requests: the audio.cpp build is the expensive part and a PR does
    # not change it. Push to a branch, the weekly schedule, or run it by hand.
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    env:
      # Outside the clone path on purpose: scripts/build_audio_cpp.sh clones into
      # audio.cpp/, and git refuses to clone into a non-empty directory -- a cache
      # restored inside it would break the build on the first cached run.
      AUDIOCPP_MODELS_ROOT: ${{ runner.temp }}/oracle-vulkan-models
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Vulkan And Build Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          # glslc is not optional: audio.cpp's ggml-vulkan CMakeLists does
          # `find_package(Vulkan COMPONENTS glslc REQUIRED)`. vulkan-tools provides
          # the vulkaninfo the smoke's device probe calls, and mesa-vulkan-drivers
          # provides the software ICD (lvp) that lets a GPU-less runner report a
          # device at all.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            git \
            glslc \
            libvulkan-dev \
            mesa-vulkan-drivers \
            ninja-build \
            pkg-config \
            vulkan-tools

      # This is the smoke's own device gate, run by hand first so a missing ICD
      # fails here with a readable message instead of turning into a skip later.
      # On a GPU-less runner the device reported here is Mesa's llvmpipe.
      - name: Verify A Vulkan Device Is Visible
        shell: bash
        run: |
          set -Eeuo pipefail
          vulkaninfo --summary | head -40
          echo
          echo "Device probe (vulkaninfo --summary) succeeded, so the smoke's first gate is open."

      - name: Bootstrap Runtime And Test Dependencies
        shell: bash
        run: python scripts/manage_install.py bootstrap --skip-doctor --include-dev

      # The model is the only download worth caching: it is large and does not
      # change between runs, unlike the source tree the build clones.
      - name: Cache The Chatterbox GGML Model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oracle-vulkan-models
          key: vulkan-smoke-model-chatterbox_q8_0-v1

      # scripts/vulkan_ci_smoke.py builds the CLI, fetches the model, asserts the
      # smoke's three gates resolve, then runs the suite with ORACLE_FAIL_ON_SKIP=1.
      - name: Build audio.cpp, Fetch The Model, Run The Suite Without Skips
        shell: bash
        run: ./.venv/bin/python scripts/vulkan_ci_smoke.py

  windows-install-smoke:
    name: Windows installer end to end (temp profile, launchers, GUI)
    runs-on: windows-latest
    # The suite pins what the installer writes; this job proves those files run.
    # It installs the runtime, downloads the pinned Chatterbox checkpoint and the
    # installer's own doctor renders a smoke pass, so it takes minutes — the
    # matrix above still gates every push and pull request quickly. Raise the
    # timeout only if a real install legitimately needs longer.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The pinned revisions are the cache key: a pin bump invalidates it, so a
      # stale model can never be reused across a pin change.
      - name: Cache Model And pip Downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/oracle-smoke/hf
            ${{ runner.temp }}/oracle-smoke/pip-cache
          key: install-smoke-${{ runner.os }}-${{ hashFiles('src/the_oracle/models/pins.py') }}

      - name: Ensure ffmpeg Is Available
        shell: pwsh
        run: |
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            ffmpeg -version | Select-Object -First 1
          } else {
            choco install ffmpeg -y --no-progress
          }

      # The profile path contains a space on purpose: the generated .cmd
      # launcher and the Start Menu entry have to survive quoting, and this
      # project's own checkout path has a space in it.
      - name: Install End To End And Exercise The Launchers
        shell: pwsh
        run: |
          python scripts/windows_install_smoke.py `
            --profile "${{ runner.temp }}\oracle smoke profile" `
            --hf-home "${{ runner.temp }}\oracle-smoke\hf" `
            --pip-cache "${{ runner.temp }}\oracle-smoke\pip-cache"
